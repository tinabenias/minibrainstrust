[build]
  command = "npm run build"
  publish = "dist"

# Permanently redirect the old domain to the new one (brand move to Mini Brains Play).
# force = true makes the redirect win even though the site is also served on this domain.
[[redirects]]
  from = "https://minibrainstrust.com.au/*"
  to = "https://minibrainsplay.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.minibrainstrust.com.au/*"
  to = "https://minibrainsplay.com.au/:splat"
  status = 301
  force = true
