[build]
  command = "npm run build"
  publish = "dist"

# Permanently redirect the old domain to the new one (brand move to Mini Brains Play).
# force = true makes the redirect win even though the site is also served on this domain.
[[redirects]]
  from = "https://minibrainstrust.com.au/*"
  to = "https://minibrainsplay.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.minibrainstrust.com.au/*"
  to = "https://minibrainsplay.com.au/:splat"
  status = 301
  force = true

# Security headers for every page.
# - X-Frame-Options / frame-ancestors stop other sites embedding ours (clickjacking).
# - nosniff stops browsers guessing file types.
# - HSTS keeps visitors on HTTPS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
