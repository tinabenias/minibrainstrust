ion", "name": "Is it safe?", "acceptedAnswer": {"@type": "Answer", "text": "Every activity is written with safety in mind, and safety notes are included where they matter. As with any play at this age, your supervision is part of it. We never suggest anything that puts a child at risk."}}, {"@type": "Question", "name": "Do you sell my data or use it for advertising?", "acceptedAnswer": {"@type": "Answer", "text": "Never. We will not sell, rent or trade your information, and we do not run ads that target you or your child. We collect as little as possible, and what happens at your kitchen table stays there."}}, {"@type": "Question", "name": "How much does it cost?", "acceptedAnswer": {"@type": "Answer", "text": "Mini Brains Play is free to download and browse. Full access to the whole library is one simple subscription: A$6.99 a month or A$59 a year. No tiers, no ads, and you can cancel any time."}}, {"@type": "Question", "name": "Is it available now?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Mini Brains Play is live on the App Store. Download it and start today."}}, {"@type": "Question", "name": "Is it Australian?", "acceptedAnswer": {"@type": "Answer", "text": "Yes, made in Australia by an Aussie parent, with Australian families, wildlife and weather in mind. Water for the birds, hats in the sun, and inside when it thunders."}}]}</script>
